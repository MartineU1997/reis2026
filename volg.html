<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volg Martine & Thijs</title>
<meta name="description" content="Waar zijn Martine en Thijs? Volg hun reis door Argentinië en Chili.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M&T reis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
@font-face { font-family: "Jakarta"; src: url("fonts/jakarta.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root {
  --bg: #f4f1ec; --surface: #fff; --surface-2: #faf8f5; --text: #121620; --muted: #667085; --line: rgba(18,22,32,.08);
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(16,24,40,.22); --accent: #2f6fd6; --accent-soft: rgba(47,111,214,.1);
  --serif: "New York", "Iowan Old Style", "Charter", ui-serif, Georgia, serif;
  --m-flight: #6366f1; --m-bus: #f59e0b; --m-boat: #06b6d4; --m-car: #64748b; --m-hike: #16a34a;
  --p-ba: #a855f7; --p-chalten: #ef6c5a; --p-calafate: #0ea5e9; --p-natales: #14b8a6; --p-paine: #f97316; --p-mendoza: #be123c; --p-uco: #65a30d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root { --bg: #0c0f14; --surface: #161b23; --surface-2: #1c222c; --text: #eef1f6; --muted: #98a2b3; --line: rgba(255,255,255,.08); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6); --accent: #7aa7ff; --accent-soft: rgba(122,167,255,.14); color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Jakarta", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
.muted { color: var(--muted); }
.tiny { font-size: 12.5px; }

/* hero */
.hero { position: relative; min-height: 78vh; min-height: 78svh; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: #0c0f14 center/cover no-repeat; padding: calc(env(safe-area-inset-top) + 18px) 20px 28px; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,10,20,.35) 0%, rgba(5,10,20,0) 30%, rgba(5,10,20,.2) 55%, rgba(5,10,20,.88) 100%); }
.hero > * { position: relative; max-width: 720px; width: 100%; margin-left: auto; margin-right: auto; }
.hero .top { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 0; right: 0; padding: 0 20px; display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 800; letter-spacing: -0.01em; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.7); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
.lang { margin-left: auto; display: flex; background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 99px; padding: 3px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-weight: 700; font-size: 13px; padding: 5px 11px; border-radius: 99px; cursor: pointer; }
.lang button.on { background: #fff; color: #121620; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .92; }
.hero h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(38px, 10vw, 58px); line-height: 1.02; letter-spacing: -0.02em; margin: 10px 0 8px; text-wrap: balance; }
.hero .lead { font-size: 17px; opacity: .92; margin: 0; max-width: 520px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 99px; background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); font-weight: 650; font-size: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); font-variant-numeric: tabular-nums; }

/* reisbalk */
.journey { margin: -34px 0 0; position: relative; z-index: 2; }
.card { background: var(--surface); border-radius: 24px; padding: 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
.bar { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); margin: 14px 4px 6px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, var(--p-ba), var(--p-chalten), var(--p-calafate), var(--p-paine), var(--p-mendoza)); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.bar b { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px var(--accent), 0 4px 10px rgba(0,0,0,.25); }
.stages { display: flex; justify-content: space-between; gap: 4px; margin-top: 10px; }
.stages span { flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.stages span.now { color: var(--text); }
.stages span::before { content: ""; display: block; width: 8px; height: 8px; border-radius: 50%; margin: 0 auto 5px; background: var(--c); opacity: .35; }
.stages span.done::before, .stages span.now::before { opacity: 1; }
.journey-head { display: flex; align-items: baseline; gap: 10px; }
.journey-head strong { font-size: 18px; letter-spacing: -0.01em; }
.journey-head span { margin-left: auto; }

h2.sec { font-family: var(--serif); font-size: 26px; letter-spacing: -0.01em; margin: 34px 2px 12px; display: flex; align-items: center; gap: 10px; }
h2.sec small { margin-left: auto; font-family: "Jakarta", sans-serif; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .card { margin: 0; }
.k { font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.big { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.big small { font-size: 18px; color: var(--muted); font-weight: 700; letter-spacing: -0.01em; }

/* kaart */
#map { height: 420px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); background: #aad3df; }
.osm { filter: saturate(.7) brightness(1.04); }
@media (prefers-color-scheme: dark) { .osm { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); } #map { background: #0b1520; } }
.leaflet-overlay-pane path.flow { stroke-dasharray: 3 12; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.me-pin { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(47,111,214,.6), 0 4px 10px rgba(0,0,0,.3); animation: ping 2s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 18px rgba(47,111,214,0), 0 4px 10px rgba(0,0,0,.3); } 100% { box-shadow: 0 0 0 0 rgba(47,111,214,0), 0 4px 10px rgba(0,0,0,.3); } }
.stop-pin { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 4px 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.leaflet-container { font-family: "Jakarta", sans-serif; }
.leaflet-popup-content-wrapper { border-radius: 16px; }

/* programma */
.today-plan .move { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.today-plan .move:first-of-type { border-top: 0; }
.mi { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: none; }
.days { list-style: none; margin: 0; padding: 0; position: relative; }
.days::before { content: ""; position: absolute; left: 25px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.days li { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 8px 0; }
.days .db { flex: none; width: 52px; height: 52px; border-radius: 16px; color: #fff; display: grid; place-items: center; text-align: center; line-height: 1; position: relative; z-index: 1; }
.days .db span { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: .9; display: block; }
.days .db b { font-size: 19px; display: block; margin-top: 2px; }
.days li.past { opacity: .55; }
.days li.now .db { box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--accent); }
.days strong { display: block; letter-spacing: -0.01em; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }

/* dagboek */
.ci { background: var(--surface); border-radius: 24px; overflow: hidden; margin: 0 0 16px; box-shadow: var(--shadow); }
.ci img { display: block; width: 100%; max-height: 520px; object-fit: cover; }
.ci .b { padding: 14px 18px 18px; }
.ci .h { display: flex; align-items: center; gap: 10px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(140deg, var(--p-ba), var(--p-calafate)); flex: none; }
.ci p { font-family: var(--serif); font-size: 19px; line-height: 1.45; margin: 12px 0 0; white-space: pre-wrap; }
.empty { text-align: center; padding: 30px 18px; color: var(--muted); }
.stay { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.stay:first-child { border-top: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 13.5px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.install { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(6,182,212,.12)); box-shadow: none; }
.install button { margin-left: auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 40px; }
.lock { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 30px; }
.reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
@media (max-width: 330px) { .grid2 { grid-template-columns: 1fr; } }
.grid2 .big { font-size: 30px; }
.mapbtn { background: var(--surface); color: var(--text); border: 0; font: inherit; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 99px; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
</style>
</head>
<body>
<div id="app"><div class="lock"><div class="muted">…</div></div></div>
<script src="vendor/leaflet.js" defer></script>
<script src="config.js" defer></script>
<script src="volg.js" defer></script>
</body>
</html>
